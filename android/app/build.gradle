apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.presenza"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.presenza"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "1.1.15"
        
        // ✅ Add this for vector drawables support
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file("presenza-release-key.jks")
            storePassword "821031"
            keyAlias "presenza-key"
            keyPassword "821031"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // ✅ React Native
    implementation("com.facebook.react:react-android")
    
    // ✅ File System
    implementation project(':react-native-fs')
    
    // ✅ Firebase / FCM
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    
    // ✅ Push Notification - Add these dependencies
    implementation project(':react-native-push-notification')
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.work:work-runtime:2.8.1'
    
    // ✅ For vector drawable support (if needed)
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ✅ Add these configurations at the bottom
configurations.all {
    resolutionStrategy {
        force 'com.facebook.fbjni:fbjni:0.7.0'
    }
}

// ✅ For Google Services
apply plugin: 'com.google.gms.google-services'